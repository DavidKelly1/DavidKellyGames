<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - David Kelly Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: #0d0d0d;
            background-image: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 30%);
            background-attachment: fixed;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate {
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.44, 0, 0.56, 1) forwards;
        }

        .animate-delay-1 { animation-delay: 0.1s; }
        .animate-delay-2 { animation-delay: 0.2s; }
        .animate-delay-3 { animation-delay: 0.3s; }
        .animate-delay-4 { animation-delay: 0.4s; }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 80px;
        }

        /* Header */
        .header {
            padding: 40px 0 20px;
            background: transparent;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #aaaaaa;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .back-link svg {
            width: 20px;
            height: 20px;
        }

        /* Main contact section */
        .contact-hero {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 60px 0 100px;
        }

        .contact-hero .container {
            width: 100%;
        }

        .contact-label {
            font-size: 16px;
            font-weight: 500;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 24px;
        }

        .contact-title {
            font-size: 80px;
            font-weight: 500;
            line-height: 1.1em;
            letter-spacing: -0.02em;
            margin-bottom: 32px;
            color: #ffffff;
        }

        .contact-description {
            font-size: 20px;
            font-weight: 400;
            color: #aaaaaa;
            max-width: 600px;
            margin-bottom: 64px;
            line-height: 1.6;
        }

        /* Contact items */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
            transition: opacity 0.3s ease;
        }

        .contact-item:hover {
            opacity: 0.6;
        }

        .contact-item svg {
            width: 28px;
            height: 28px;
            color: #aaaaaa;
            flex-shrink: 0;
        }

        /* Divider */
        .contact-divider {
            width: 100%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.08);
            margin: 64px 0;
        }

        /* Footer */
        footer {
            padding: 32px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-name {
            font-size: 16px;
            font-weight: 500;
            color: #aaaaaa;
        }

        .footer-links {
            display: flex;
            gap: 32px;
        }

        .footer-link {
            font-size: 14px;
            color: #aaaaaa;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: #ffffff;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .contact-title {
                font-size: 64px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 24px;
            }

            .contact-title {
                font-size: 44px;
            }

            .contact-description {
                font-size: 18px;
            }

            .contact-item {
                font-size: 18px;
            }

            .footer-content {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="back-link animate">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back To Projects
            </a>
        </div>
    </header>

    <!-- Contact Hero -->
    <section class="contact-hero">
        <div class="container">
            <p class="contact-label animate">Contact</p>
            <h1 class="contact-title animate animate-delay-1">Get in touch</h1>
            <p class="contact-description animate animate-delay-2">
                Have any questions or a project in mind? Let's chat.
            </p>

            <div class="contact-list">
                <!-- Email -->
                <a href="mailto:david.kelly033@gmail.com" class="contact-item animate animate-delay-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M1.5 8.67v8.58a3 3 0 003 3h15a3 3 0 003-3V8.67l-8.928 5.493a3 3 0 01-3.144 0L1.5 8.67z" />
                        <path d="M22.5 6.908V6.75a3 3 0 00-3-3h-15a3 3 0 00-3 3v.158l9.714 5.978a1.5 1.5 0 001.572 0L22.5 6.908z" />
                    </svg>
                    <span>David.kelly033@gmail.com</span>
                </a>

                <!-- LinkedIn -->
                <a href="https://www.linkedin.com/in/david-kelly-5a2a94224" target="_blank" class="contact-item animate animate-delay-3">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                    <span>LinkedIn</span>
                </a>

                <!-- Phone -->
                <a href="tel:+447415304333" class="contact-item animate animate-delay-4">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z"
                            clip-rule="evenodd" />
                    </svg>
                    <span>(+44) 0741 530 4333</span>
                </a>
            </div>
        </div>
    </section>

    <script>
        document.querySelectorAll('.animate').forEach(el => {
            el.style.animationPlayState = 'running';
        });
    </script>

</body>

</html>
